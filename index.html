<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>마롱이 간병일지</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#27312e;background:#f7f8f4}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:16px 14px 90px}h1{font-size:25px;margin:9px 0 3px}h2{font-size:18px;margin:0 0 13px}.muted{color:#697771;font-size:13px}.panel{background:white;border:1px solid #e1e7df;border-radius:19px;padding:17px;margin:14px 0;box-shadow:0 2px 10px #213c2810}button{font:inherit;cursor:pointer;border:1px solid #d7e0d8;background:#fff;color:#26352e;border-radius:12px;padding:11px 12px;touch-action:manipulation}button:active{transform:scale(.97)}.primary{background:#287a59;color:white;border-color:#287a59;font-weight:700}.danger{color:#a43e3e}.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.chips button{min-height:49px}.chips button.on{background:#e0f2e8;border:2px solid #287a59;font-weight:700}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.counter{font-size:31px;font-weight:800;margin:8px 0}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.steps button{background:#edf4ef;font-weight:700}.steps .reset{background:#fff2f0;color:#9c3d34}.wide{width:100%;margin-top:12px;padding:14px}.calendar-head{display:flex;justify-content:space-between;align-items:center}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;font-size:12px;color:#7b8780;padding:6px 0}.day{min-height:48px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid transparent}.day.active{background:#e3f2e9;border-color:#2a845d;font-weight:700}.day.today{color:#16784f}.dot{width:6px;height:6px;background:#2a845d;border-radius:50%}.blank{height:48px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f2f6f2;padding:12px 5px;border-radius:12px;text-align:center}.stat b{display:block;font-size:20px;margin-top:5px}.entry{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #edf0ec}.entry small{color:#718077}.entry button{padding:5px 9px;font-size:12px}.graph{width:100%;height:210px}.switch{display:flex;gap:8px}.switch button.on{background:#287a59;color:#fff}input[type=file]{display:none}.foot{font-size:12px;line-height:1.6;color:#68776f} .notice{padding:10px;background:#f0f7f1;border-radius:12px;font-size:13px} .tabs{display:flex;gap:7px}.tabs button{flex:1}.tabs button.on{background:#287a59;color:#fff} @media(max-width:370px){.chips{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main><h1>🐈 마롱이 간병일지</h1><div class="muted" id="clock"></div><div class="panel"><h2>빠른 기록</h2><div class="chips" id="choices"></div><div id="amountArea" style="display:none;margin-top:15px"><div class="muted" id="amountLabel"></div><div class="counter"><span id="amount">0</span> <span id="unit">ml</span></div><div class="steps" id="steps"></div><div class="muted" id="feedHint" style="display:none;margin-top:9px">사료는 저울에 표시된 현재 전체 무게를 입력하세요. 직전 무게와 비교합니다.</div></div><div class="row" style="margin:14px 0 9px;gap:12px;flex-wrap:wrap"><label><input type="radio" name="timeMode" value="now" checked> 지금 시간</label><label><input type="radio" name="timeMode" value="manual"> 수동 입력</label></div><div id="manualTimeArea" style="display:none;margin-bottom:12px"><label for="manualTime">기록할 날짜와 시간</label><input type="datetime-local" id="manualTime" style="display:block;width:100%;padding:12px;margin-top:6px;border:1px solid #cbd5ce;border-radius:10px;font-size:16px"></div><button class="primary wide" id="save">기록 저장</button><div class="muted" style="margin-top:9px" id="status">기록할 항목을 선택하세요.</div></div>
<div class="panel"><div class="calendar-head"><h2>월간 달력</h2><div class="row"><button id="prev">‹</button><strong id="month"></strong><button id="next">›</button></div></div><div class="calendar" id="cal"></div></div>
<div class="panel"><h2 id="dayTitle">선택한 날짜</h2><div class="stats"><div class="stat">💧 수액<b id="fluidTotal">0 ml</b></div><div class="stat">🥣 밥<b id="mealTotal">0 ml</b></div><div class="stat">🐾 사료 섭취<b id="foodTotal">0 g</b></div></div><div class="muted" style="margin:11px 0" id="added"></div><div id="entries"></div></div>
<div class="panel"><h2>섭취량 그래프</h2><div class="switch"><button class="on" data-period="week">최근 7일</button><button data-period="month">최근 30일</button></div><div class="muted" style="margin:12px 0">초록: 사료 섭취(g) · 주황: 밥(ml)</div><canvas class="graph" id="graph"></canvas></div>
<div class="panel"><h2>기록 백업</h2><div class="row"><button id="export">JSON 백업 저장</button><button id="importBtn">백업 불러오기</button><input type="file" id="import" accept="application/json,.json"></div><p class="foot">기록은 이 기기의 브라우저에만 저장됩니다. 브라우저 데이터를 삭제하거나 기기를 바꾸면 사라질 수 있으므로 정기적으로 백업하세요. 다른 기기와 자동 동기화되지는 않습니다.</p></div></main><script>
(()=>{'use strict';const KEY='maron-care-v1';let records=[];try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(x))records=x}catch{};const cats=['유산균','크레메진','철','항산화제','밥','수액','사료 무게','소변','대변','구토'];let selected='',amount=0,period='week';const now=()=>new Date();const localDay=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;let chosen=localDay(now()),view=new Date(now().getFullYear(),now().getMonth(),1);const $=id=>document.getElementById(id);const persist=()=>{localStorage.setItem(KEY,JSON.stringify(records));render()};const fmt=n=>Number(n).toLocaleString('ko-KR');const getSorted=()=>records.slice().sort((a,b)=>a.ts-b.ts||String(a.id).localeCompare(String(b.id)));function changeCategory(c){selected=c;amount=0;document.querySelectorAll('#choices button').forEach(b=>b.classList.toggle('on',b.textContent===c));const isAmount=['밥','수액','사료 무게'].includes(c);$('amountArea').style.display=isAmount?'block':'none';$('status').textContent=c+' 선택됨';if(isAmount){$('unit').textContent=c==='사료 무게'?'g':'ml';$('amountLabel').textContent=c==='사료 무게'?'현재 사료 저울 무게':'기록할 양';$('feedHint').style.display=c==='사료 무게'?'block':'none';$('steps').innerHTML='';(c==='사료 무게'?[100,10,1]:[10,1]).forEach(v=>{let b=document.createElement('button');b.textContent=`+${v}${c==='사료 무게'?'g':'ml'}`;b.onclick=()=>{amount+=v;updateAmount()};$('steps').append(b)});let b=document.createElement('button');b.textContent='↺ 리셋';b.className='reset';b.onclick=()=>{amount=0;updateAmount()};$('steps').append(b);updateAmount()}}function updateAmount(){$('amount').textContent=fmt(amount)}cats.forEach(c=>{let b=document.createElement('button');b.textContent=c;b.onclick=()=>changeCategory(c);$('choices').append(b)});
function feedDiff(weight){const prev=getSorted().filter(r=>r.type==='사료 무게').at(-1);return prev?weight-prev.amount:null}
document.querySelectorAll('input[name=timeMode]').forEach(r=>r.addEventListener('change',()=>{const manual=document.querySelector('input[name=timeMode]:checked').value==='manual';$('manualTimeArea').style.display=manual?'block':'none';if(manual&&!$('manualTime').value){const d=now();const pad=n=>String(n).padStart(2,'0');$('manualTime').value=`${localDay(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`}}));$('save').onclick=()=>{if(!selected){$('status').textContent='먼저 항목을 선택하세요.';return}if(['밥','수액','사료 무게'].includes(selected)&&amount<=0){$('status').textContent='양을 버튼으로 입력하세요.';return}const manual=document.querySelector('input[name=timeMode]:checked').value==='manual';const t=manual?new Date($('manualTime').value):now();if(!Number.isFinite(t.getTime())){$('status').textContent='날짜와 시간을 입력하세요.';return}const rec={id:(crypto.randomUUID?.()||String(Date.now())+Math.random()),ts:t.getTime(),date:localDay(t),type:selected,amount:['밥','수액','사료 무게'].includes(selected)?amount:null};if(selected==='사료 무게'){const diff=feedDiff(amount);rec.diff=diff;rec.prevWeight=diff===null?null:amount-diff}records.push(rec);if(selected==='사료 무게')recalcFeed();chosen=rec.date;view=new Date(t.getFullYear(),t.getMonth(),1);persist();$('status').textContent=`✓ ${localDay(t)} ${t.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})} 기록 완료`+(selected==='사료 무게'?(rec.diff===null?' · 첫 기준 무게':rec.diff<0?` · 사료 섭취 ${-rec.diff}g`:rec.diff>0?` · 사료 추가 ${rec.diff}g`:' · 변동 없음'):'');amount=0;updateAmount()};
function getDaily(date){const rs=records.filter(r=>r.date===date);return{fluid:rs.filter(r=>r.type==='수액').reduce((s,r)=>s+r.amount,0),meal:rs.filter(r=>r.type==='밥').reduce((s,r)=>s+r.amount,0),food:rs.filter(r=>r.type==='사료 무게'&&r.diff<0).reduce((s,r)=>s-r.diff,0),added:rs.filter(r=>r.type==='사료 무게'&&r.diff>0).reduce((s,r)=>s+r.diff,0)}}
function render(){const year=view.getFullYear(),month=view.getMonth();$('month').textContent=`${year}년 ${month+1}월`;$('cal').innerHTML='';['일','월','화','수','목','금','토'].forEach(x=>{let d=document.createElement('div');d.className='dow';d.textContent=x;$('cal').append(d)});for(let i=0;i<new Date(year,month,1).getDay();i++){let b=document.createElement('div');b.className='blank';$('cal').append(b)}for(let i=1;i<=new Date(year,month+1,0).getDate();i++){const date=localDay(new Date(year,month,i));let b=document.createElement('button');b.className='day'+(date===chosen?' active':'')+(date===localDay(now())?' today':'');let s=document.createElement('span');s.textContent=i;b.append(s);if(records.some(r=>r.date===date)){let dot=document.createElement('span');dot.className='dot';b.append(dot)}b.onclick=()=>{chosen=date;render()};$('cal').append(b)}$('dayTitle').textContent=`${chosen} 기록`;const d=getDaily(chosen);$('fluidTotal').textContent=fmt(d.fluid)+' ml';$('mealTotal').textContent=fmt(d.meal)+' ml';$('foodTotal').textContent=fmt(d.food)+' g';$('added').textContent=`사료 추가량: ${fmt(d.added)} g`;$('entries').innerHTML='';const list=getSorted().filter(r=>r.date===chosen);if(!list.length){$('entries').textContent='이 날짜에 저장된 기록이 없습니다.'}else list.forEach(r=>{let line=document.createElement('div');line.className='entry';let content=document.createElement('div');let time=document.createElement('small');time.textContent=new Date(r.ts).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false})+'  ';let title=document.createElement('span');title.textContent=r.type+(r.amount!==null?' '+fmt(r.amount)+(r.type==='사료 무게'?'g':'ml'):'');content.append(time,title);if(r.type==='사료 무게'){let sub=document.createElement('div');sub.className='muted';sub.textContent=r.diff===null?'최초 기준 무게':r.diff<0?`섭취 ${-r.diff}g`:r.diff>0?`추가 ${r.diff}g`:'변동 없음';content.append(sub)}let del=document.createElement('button');del.className='danger';del.textContent='삭제';del.onclick=()=>{if(confirm('이 기록을 삭제할까요?')){records=records.filter(x=>x.id!==r.id);recalcFeed();persist()}};line.append(content,del);$('entries').append(line)});drawGraph()}
function recalcFeed(){let prev=null;getSorted().forEach(r=>{if(r.type==='사료 무게'){r.prevWeight=prev;r.diff=prev===null?null:r.amount-prev;prev=r.amount}})}
$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{period=b.dataset.period;document.querySelectorAll('[data-period]').forEach(x=>x.classList.toggle('on',x===b));drawGraph()});
function drawGraph(){const canvas=$('graph'),width=canvas.clientWidth||320,height=210,dpr=window.devicePixelRatio||1;canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,width,height);const n=period==='week'?7:30;let data=[];for(let i=n-1;i>=0;i--){const d=now();d.setHours(12,0,0,0);d.setDate(d.getDate()-i);const key=localDay(d);data.push({date:key,...getDaily(key)})}const max=Math.max(10,...data.flatMap(d=>[d.food,d.meal]));const left=33,right=9,top=13,bottom=35,w=width-left-right,h=height-top-bottom;ctx.font='11px system-ui';ctx.fillStyle='#697771';ctx.strokeStyle='#e5eae4';for(let k=0;k<=4;k++){const y=top+h*k/4;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(width-right,y);ctx.stroke();ctx.fillText(String(Math.round(max*(4-k)/4)),1,y+4)}const step=w/n;data.forEach((d,i)=>{const x=left+i*step;const bw=Math.max(2,step*.31);ctx.fillStyle='#2b9168';ctx.fillRect(x+step*.13,top+h-d.food/max*h,bw,d.food/max*h);ctx.fillStyle='#e9a45e';ctx.fillRect(x+step*.52,top+h-d.meal/max*h,bw,d.meal/max*h);if(i%(period==='week'?1:5)===0){ctx.fillStyle='#697771';ctx.fillText(d.date.slice(5).replace('-','/'),x,top+h+16)}})}window.addEventListener('resize',drawGraph);
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'maron-care',version:1,records},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='마롱이_간병일지_'+localDay(now())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};$('importBtn').onclick=()=>$('import').click();$('import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.records)||!data.records.every(r=>typeof r.id==='string'&&typeof r.ts==='number'&&typeof r.type==='string'&&typeof r.date==='string'))throw Error('파일 형식이 맞지 않습니다');if(!confirm('현재 기록을 백업 파일의 기록으로 교체할까요?'))return;records=data.records;recalcFeed();persist();alert('백업을 불러왔습니다')}catch(err){alert('백업을 읽지 못했습니다: '+err.message)}e.target.value=''};function tick(){$('clock').textContent=now().toLocaleString('ko-KR',{dateStyle:'full',timeStyle:'short'})+' · 저장 시각 자동 입력'}tick();setInterval(tick,30000);render();})();
</script></body></html>
